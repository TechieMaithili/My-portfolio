<!DOCTYPE html>
<html>
<head>
	<title>jQuery Animate</title>
	<script src="jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
			$('#b1').click(function(){
				$('div').animate({borderRadius:'50px',height:'100px', width:'100px',marginLeft:'200px'},5000);
			});
				
		    
        });
	</script>
</head>
<body>
	<h4>Roll no. 165</h4>
<button id="b1">Animate</button>&nbsp;&nbsp;
<br><br>
<div style="height:200px;width:200px;background-color:#3AC599"></div>
</body>
</html>
