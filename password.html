<!DOCTYPE html>
<html>
<head>
	
	<title>Password Validation</title>
</head>
<body>
     <script>
     	function validateForm()
     	{
     		var pw = document.f1.pwd.value;
     		var p1 = /[A-Z]/;
     		var p2 = /[a-z]/;
     		var p3 = /[0-9]/;
     		if(pw.length < 8)
     		{
     			alert("Password should be atleast 8 characters");
     			document.f1.pwd.focus();
     			return false;
     		}
     		if(p1.test(pw)==false || p2.test(pw)==false || p3.test(pw)==false)
     		{
     			alert("Password should contain one uppercase , one lowercase letter and one digit");
     			document.f1.pwd.focus();
     			return false;
     		}
     	}
     </script>
     <h4>Roll no. 165</h4>
     <form name="f1" action="response.html" method="post" onSubmit="return validateForm()">
     	Password: <input type="text" name="pwd">
     	<p> <input type="submit" value="OK"></p>
     </form>


</body>
</html>
